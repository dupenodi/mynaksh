name: mynaksh

services:
  app:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - api

  # Holds the OpenRouter key (from .env) and streams replies to the app.
  api:
    image: node:22-alpine
    working_dir: /srv
    command: node server/proxy.mjs
    volumes:
      - ./server:/srv/server:ro
    env_file: .env
    ports:
      - "8787:8787"
