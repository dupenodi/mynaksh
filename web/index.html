<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="color-scheme" content="light" />
    <title>MyNaksh</title>
    <style>
      html,
      body {
        height: 100%;
        /* Tracks the visible area as mobile browser bars and the keyboard come and go. */
        height: 100dvh;
        margin: 0;
        background-color: #ffffff;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }
      #root {
        display: flex;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
