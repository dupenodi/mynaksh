<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#FBFAF8" />
    <meta name="color-scheme" content="light" />
    <title>MyNaksh</title>
    <style>
      html,
      body {
        height: 100%;
        /* Tracks the visible area as mobile browser bars and the keyboard come and go. */
        height: 100dvh;
        margin: 0;
        background-color: #ede5da;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }
      #root {
        display: flex;
        width: 100%;
        height: 100%;
      }
      [data-hscroll]::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }
      [data-birth-field] {
        transition: border-color 160ms ease;
      }
      [data-birth-field] input {
        outline: none;
        min-width: 0;
      }
      [data-birth-field] input::-webkit-calendar-picker-indicator {
        cursor: pointer;
        opacity: 0.55;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
